services:
  - type: web
    name: jayshop-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MARKUP_PCT
        value: "0.30"
      - key: DATA_DIR
        value: ./data
      - key: PRODSELLER_API_KEY
        sync: false # 在 Render 控制台手动填入，勿提交
      - key: ADMIN_PASSWORD
        sync: false # 在 Render 控制台手动填入，勿提交
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
