<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jayshop · 精选好货</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">J</div>
      <div>
        <div class="brand-name">Jayshop</div>
        <div class="brand-sub">精选好货 · 自动发货</div>
      </div>
    </div>
  </header>

  <!-- 演示模式横幅：仅 demoMode=true 时显示 -->
  <div id="demoBanner" class="demo-banner" style="display:none">
    <div class="wrap">
      <span>⚠️</span>
      <span><strong>演示模式：</strong>当前展示真实商品目录与价格，店主配置 API Key 后即上线实时库存与自动发货。</span>
    </div>
  </div>

  <main class="container" id="app">
    <!-- 骨架屏（加载中） -->
    <div id="skeleton" class="skeleton-grid" aria-hidden="true">
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
    </div>
    <!-- 商品网格 -->
    <div id="grid" class="grid" style="display:none"></div>
    <!-- 状态区（空态 / 错误态） -->
    <div id="state" style="display:none"></div>
  </main>

  <footer class="footer">
    <div>Jayshop · 下单后请联系店主确认发货</div>
  </footer>

  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var skeleton = document.getElementById('skeleton');
    var grid = document.getElementById('grid');
    var state = document.getElementById('state');
    var banner = document.getElementById('demoBanner');

    function showState(html) {
      skeleton.style.display = 'none';
      grid.style.display = 'none';
      state.style.display = 'block';
      state.innerHTML = html;
    }

    function render(products) {
      skeleton.style.display = 'none';
      state.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = products.map(function (p) {
        var inStock = p.inStock !== false;
        var stockHtml = inStock
          ? '<span class="stock ok"><span class="dot"></span>有货</span>'
          : '<span class="stock soldout"><span class="dot"></span>已售罄</span>';
        return (
          '<a class="p-card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
            '<div class="p-thumb">' + Jay.thumbHTML(p) + '</div>' +
            '<div class="p-body">' +
              '<div class="p-name">' + Jay.esc(p.name || '未命名商品') + '</div>' +
              '<div class="p-price">' + Jay.fmtMoney(p.price) + '</div>' +
              stockHtml +
            '</div>' +
          '</a>'
        );
      }).join('');
    }

    async function load() {
      var r = await Jay.api('/api/products');
      if (!r.ok) {
        showState(Jay.errorStateHTML('商品加载失败',
          r.networkError ? '网络连接失败，请检查网络后重试。' : '服务器繁忙（' + r.status + '），请稍后重试。'));
        return;
      }
      var products = (r.data && r.data.products) || [];
      if (r.data && r.data.demoMode === true) {
        banner.style.display = 'block';
      }
      if (products.length === 0) {
        showState(Jay.emptyStateHTML());
        return;
      }
      render(products);
    }

    load();
  })();
  </script>
</body>
</html>
