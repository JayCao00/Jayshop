<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jayshop · 精选好货</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner nav-inner">
      <a class="home-link" href="index.html" style="flex:none">
        <div class="logo">J</div>
        <div>
          <div class="brand-name">Jayshop</div>
          <div class="brand-sub">精选好货 · 自动发货</div>
        </div>
      </a>
      <div class="nav-search">
        <span class="nav-search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索商品…" autocomplete="off" aria-label="搜索商品">
        <button id="searchClear" class="nav-search-clear" style="display:none" aria-label="清除搜索">✕</button>
      </div>
      <a class="nav-link" href="order.html">📋 查订单</a>
    </div>
  </header>

  <!-- 演示模式横幅：仅 demoMode=true 时显示 -->
  <div id="demoBanner" class="demo-banner" style="display:none">
    <div class="wrap">
      <span>⚠️</span>
      <span><strong>演示模式：</strong>当前展示真实商品目录与价格，店主配置 API Key 后即上线实时库存与自动发货。</span>
    </div>
  </div>

  <main class="container" id="app">
    <!-- 分类标签 -->
    <div id="tabs" class="tabs" style="display:none" aria-label="商品分类"></div>
    <!-- 骨架屏（加载中） -->
    <div id="skeleton" class="skeleton-grid" aria-hidden="true">
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
    </div>
    <!-- 商品网格 -->
    <div id="grid" class="grid" style="display:none"></div>
    <!-- 状态区（空态 / 错误态） -->
    <div id="state" style="display:none"></div>
  </main>

  <!-- 购买指南 -->
  <section class="guide">
    <h2>购买指南</h2>
    <p class="guide-sub">清晰选择 · 自助选购 · 订单可查</p>
    <div class="guide-steps">
      <div class="guide-step">
        <div class="guide-num">01</div>
        <h3>选择商品</h3>
        <p>浏览分类或搜索，找到需要的商品下单，记下订单号。</p>
      </div>
      <div class="guide-step">
        <div class="guide-num">02</div>
        <h3>付款并提交凭证</h3>
        <p>按订单金额付款（支付宝扫码 / 币安 UID 转账），<strong>必须上传付款截图并提交</strong>，否则无法发货。</p>
      </div>
      <div class="guide-step">
        <div class="guide-num">03</div>
        <h3>等待发货</h3>
        <p>店主核对到账后发货，凭订单号在「查订单」页面查看卡密。</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div>Jayshop · 下单后请联系店主确认发货</div>
  </footer>

  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var skeleton = document.getElementById('skeleton');
    var grid = document.getElementById('grid');
    var state = document.getElementById('state');
    var banner = document.getElementById('demoBanner');
    var tabsEl = document.getElementById('tabs');
    var searchInput = document.getElementById('searchInput');
    var searchClear = document.getElementById('searchClear');

    // 分类标签（key 与后端 getCategory 一致；featured 为热门，由后端标记）
    var CATS = {
      featured: '🔥热门', ai: '🤖AI工具', media: '🎬影视音乐', office: '🛠️办公设计',
      edu: '🎓学习教育', network: '🌐网络工具', account: '📧账号邮箱', other: '📦其他'
    };
    var TAB_ORDER = ['all', 'featured', 'ai', 'media', 'office', 'edu', 'network', 'account', 'other'];
    var allProducts = [];
    var curTab = 'all';
    var keyword = '';

    function matchTab(p) {
      if (curTab === 'all') return true;
      if (curTab === 'featured') return !!p.featured;
      return p.category === curTab;
    }

    function matchSearch(p) {
      if (!keyword) return true;
      return (p.name || '').toLowerCase().indexOf(keyword) !== -1;
    }

    function matchAll(p) { return matchTab(p) && matchSearch(p); }

    function renderTabs() {
      var counts = { all: allProducts.length, featured: 0 };
      allProducts.forEach(function (p) {
        if (p.featured) counts.featured++;
        counts[p.category] = (counts[p.category] || 0) + 1;
      });
      var html = '';
      TAB_ORDER.forEach(function (key) {
        var c = counts[key] || 0;
        if (key !== 'all' && c === 0) return;
        var label = key === 'all' ? '全部' : (CATS[key] || key);
        html += '<button class="tab' + (curTab === key ? ' active' : '') + '" data-tab="' + key + '">' +
          label + ' ' + c + '</button>';
      });
      tabsEl.innerHTML = html;
      tabsEl.style.display = 'flex';
    }

    function showState(html) {
      skeleton.style.display = 'none';
      grid.style.display = 'none';
      state.style.display = 'block';
      state.innerHTML = html;
    }

    function render() {
      skeleton.style.display = 'none';
      state.style.display = 'none';
      grid.style.display = 'grid';
      var list = allProducts.filter(matchAll);
      if (!list.length) {
        grid.style.display = 'none';
        showState(keyword
          ? Jay.emptyStateHTML('没有找到 "' + keyword + '"', '换个关键词试试～')
          : Jay.emptyStateHTML('该分类暂无商品', '换个分类看看～'));
        // 空态时保留标签页可见，方便切换
        tabsEl.style.display = 'flex';
        return;
      }
      grid.innerHTML = list.map(function (p) {
        var inStock = p.inStock !== false;
        var stockHtml = inStock
          ? '<span class="stock ok"><span class="dot"></span>有货</span>'
          : '<span class="stock soldout"><span class="dot"></span>已售罄</span>';
        return (
          '<a class="p-card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
            '<div class="p-thumb">' + Jay.thumbHTML(p) + '</div>' +
            '<div class="p-body">' +
              '<div class="p-name">' + Jay.esc(p.name || '未命名商品') + '</div>' +
              '<div class="p-price">' + Jay.fmtMoney(p.price) + '</div>' +
              stockHtml +
            '</div>' +
          '</a>'
        );
      }).join('');
    }

    async function load() {
      var r = await Jay.api('/api/products');
      if (!r.ok) {
        showState(Jay.errorStateHTML('商品加载失败',
          r.networkError ? '网络连接失败，请检查网络后重试。' : '服务器繁忙（' + r.status + '），请稍后重试。'));
        return;
      }
      var products = (r.data && r.data.products) || [];
      if (r.data && r.data.demoMode === true) {
        banner.style.display = 'block';
      }
      if (products.length === 0) {
        showState(Jay.emptyStateHTML());
        return;
      }
      allProducts = products;
      renderTabs();
      render();
    }

    tabsEl.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]');
      if (!b) return;
      curTab = b.getAttribute('data-tab');
      renderTabs();
      render();
    });

    // 搜索：实时过滤商品名称（与分类叠加）
    function applySearch() {
      keyword = searchInput.value.trim().toLowerCase();
      searchClear.style.display = keyword ? '' : 'none';
      render();
    }
    searchInput.addEventListener('input', applySearch);
    searchClear.addEventListener('click', function () {
      searchInput.value = '';
      applySearch();
      searchInput.focus();
    });

    load();
  })();
  </script>
</body>
</html>
