<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jayshop · 订单状态</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="home-link" href="index.html">
        <div class="logo">J</div>
        <div>
          <div class="brand-name">Jayshop</div>
          <div class="brand-sub">精选好货 · 自动发货</div>
        </div>
      </a>
    </div>
  </header>

  <main class="container narrow" id="app">
    <!-- 加载中 -->
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>订单查询中…</p>
    </div>
    <!-- 状态区（缺少订单号 / 404 / 错误） -->
    <div id="state" style="display:none"></div>

    <!-- 订单主体 -->
    <div id="order" style="display:none">
      <div class="card" style="text-align:center;padding:24px 16px">
        <div class="order-no" id="oNo"></div>
        <div style="margin:12px 0">
          <span class="status-badge" id="oBadge"><span class="dot"></span><span id="oBadgeText"></span></span>
        </div>
        <p id="oTip" style="margin:0;font-size:14px;color:var(--text-2)"></p>
      </div>

      <div class="card order-lines" id="oLines"></div>

      <!-- 卡密区：delivered 时展示 -->
      <div id="keyZone" style="display:none">
        <div class="keybox">
          <div class="label">🎉 您的卡密 / 兑换码</div>
          <div class="key" id="oKey"></div>
          <div class="tip">长按可选中复制，请妥善保管</div>
        </div>
        <button class="btn" id="copyBtn">📋 复制卡密</button>
      </div>

      <div style="text-align:center;margin-top:16px">
        <a href="index.html" style="font-size:14px;color:var(--brand-1);text-decoration:none">← 返回首页继续选购</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var id = Jay.param('id');
    var loadingEl = document.getElementById('loading');
    var stateEl = document.getElementById('state');
    var orderEl = document.getElementById('order');
    var keyZone = document.getElementById('keyZone');
    var keyEl = document.getElementById('oKey');
    var timer = null;
    var lastStatus = null;

    var STATUS_TEXT = {
      pending: '已提交，等待店主确认',
      confirmed: '店主已确认，正在为您发货',
      delivered: '已发货',
      failed: '订单异常',
      cancelled: '订单已取消',
    };
    var PAY_TEXT = { alipay: '支付宝', usdt: 'USDT（币安）' };
    var STATUS_TIP = {
      pending: '店主看到后会尽快确认并发货，请稍候。本页面会自动刷新。',
      confirmed: '订单已确认，卡密稍后送达，请稍候。本页面会自动刷新。',
      delivered: '发货成功！请复制下方卡密并妥善保管。',
      failed: '该订单处理失败，款项如有扣除请联系店主处理。',
      cancelled: '该订单已被取消。如有疑问请联系店主。',
    };
    // 达到终态后停止轮询
    var FINAL = { delivered: 1, failed: 1, cancelled: 1 };

    function showState(html) {
      stopPoll();
      loadingEl.style.display = 'none';
      orderEl.style.display = 'none';
      stateEl.style.display = 'block';
      stateEl.innerHTML = html;
    }

    function render(o) {
      loadingEl.style.display = 'none';
      stateEl.style.display = 'none';
      orderEl.style.display = 'block';

      document.getElementById('oNo').textContent = '订单号：' + o.orderId;
      var badge = document.getElementById('oBadge');
      badge.className = 'status-badge ' + o.status;
      document.getElementById('oBadgeText').textContent = STATUS_TEXT[o.status] || o.status;

      // 各支付方式 pending 订单的专属提示
      var tipEl = document.getElementById('oTip');
      var payAction = '';
      if ((o.payMethod === 'alipay' || o.payMethod === 'usdt') && o.status === 'pending') {
        if (o.payState === 'unpaid') {
          tipEl.textContent = o.payMethod === 'alipay'
            ? '请选择支付宝完成付款，然后点击「我已付款」通知店主。'
            : '请通过币安 UID 内部转账完成付款，然后点击「我已付款」通知店主。';
          payAction = '<div style="margin-top:12px"><a class="btn" style="text-decoration:none;display:inline-block;width:auto;padding:12px 40px" ' +
            'href="pay.html?id=' + encodeURIComponent(o.orderId) + '">去付款</a></div>';
        } else {
          tipEl.textContent = o.payMethod === 'alipay'
            ? '已收到您的付款通知，店主正在核对支付宝到账，请稍候。本页面会自动刷新。'
            : '已收到您的付款通知，店主正在核对币安到账，请稍候。本页面会自动刷新。';
        }
      } else {
        tipEl.textContent = STATUS_TIP[o.status] || '';
      }

      document.getElementById('oLines').innerHTML =
        '<div class="row"><span>商品</span><span class="v">' + Jay.esc(o.productName || '--') + '</span></div>' +
        '<div class="row"><span>数量</span><span class="v">× ' + Jay.esc(o.quantity != null ? o.quantity : '--') + '</span></div>' +
        '<div class="row"><span>支付方式</span><span class="v">' + Jay.esc(PAY_TEXT[o.payMethod] || 'USDT') + '</span></div>' +
        '<div class="row"><span>下单时间</span><span class="v">' + Jay.esc(Jay.fmtTime(o.createdAt)) + '</span></div>' +
        '<div class="row total-line"><span>实付金额</span><span class="v">' + Jay.fmtMoney(o.totalPrice) + '</span></div>' +
        payAction;

      if (o.status === 'delivered' && o.deliveredKey) {
        keyEl.textContent = o.deliveredKey;
        keyZone.style.display = 'block';
        if (lastStatus !== 'delivered') {
          Jay.toast('🎉 卡密已送达！');
        }
      } else {
        keyZone.style.display = 'none';
      }
      lastStatus = o.status;

      if (FINAL[o.status]) {
        stopPoll();
      }
    }

    async function fetchOrder() {
      var r = await Jay.api('/api/orders/' + encodeURIComponent(id));
      if (!r.ok) {
        if (r.status === 404) {
          showState(Jay.notFoundHTML('订单不存在', '该订单号有误或订单已被删除。', 'index.html'));
        } else if (r.networkError) {
          Jay.toast('网络断开，正在重试…', true);
        } else {
          Jay.toast('查询失败（' + r.status + '），稍后自动重试', true);
        }
        return;
      }
      var o = r.data;
      if (!o || !o.orderId) {
        showState(Jay.notFoundHTML('订单不存在', '该订单号有误或订单已被删除。', 'index.html'));
        return;
      }
      render(o);
    }

    function stopPoll() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    function startPoll() {
      stopPoll();
      timer = setInterval(fetchOrder, 5000);
    }

    document.getElementById('copyBtn').addEventListener('click', async function () {
      var ok = await Jay.copyText(keyEl.textContent);
      Jay.toast(ok ? '卡密已复制到剪贴板' : '复制失败，请长按卡密手动复制', !ok);
    });

    // 页面隐藏时暂停轮询，回到前台恢复，省电省流量
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { stopPoll(); }
      else if (!FINAL[lastStatus]) { fetchOrder(); startPoll(); }
    });

    if (!id) {
      // 查单页：输入订单号跳转到详情
      stateEl.style.display = 'block';
      stateEl.innerHTML =
        '<div class="state">' +
          '<div class="emoji">📋</div>' +
          '<h2>查询订单</h2>' +
          '<p>输入下单时获得的订单号，查看付款状态与卡密。</p>' +
          '<div style="display:flex;gap:8px;max-width:360px;margin:0 auto">' +
            '<input id="qOrderId" type="text" placeholder="粘贴订单号" autocomplete="off"' +
              ' style="flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line,#ddd);border-radius:10px;font-size:15px">' +
            '<button id="qOrderBtn" class="btn small" style="width:auto;padding:12px 20px">查询</button>' +
          '</div>' +
          '<div style="margin-top:16px"><a href="index.html" style="font-size:14px;color:var(--text-2)">← 返回首页</a></div>' +
        '</div>';
      function doQuery() {
        var v = document.getElementById('qOrderId').value.trim();
        if (!v) { Jay.toast('请输入订单号', true); return; }
        location.href = 'order.html?id=' + encodeURIComponent(v);
      }
      document.getElementById('qOrderBtn').addEventListener('click', doQuery);
      document.getElementById('qOrderId').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doQuery();
      });
    } else {
      fetchOrder();
      startPoll();
    }
  })();
  </script>
</body>
</html>
