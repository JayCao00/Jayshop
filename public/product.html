<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Jayshop · 商品详情</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="home-link" href="index.html">
        <div class="logo">J</div>
        <div>
          <div class="brand-name">Jayshop</div>
          <div class="brand-sub">精选好货 · 自动发货</div>
        </div>
      </a>
    </div>
  </header>

  <main class="container" id="app">
    <!-- 加载中 -->
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>商品加载中…</p>
    </div>
    <!-- 状态区（404 / 错误） -->
    <div id="state" style="display:none"></div>

    <!-- 详情主体 -->
    <div id="detail" style="display:none">
      <div class="detail-img" id="dImg"></div>
      <h1 class="detail-name" id="dName"></h1>
      <div id="dStock"></div>
      <div class="detail-price" id="dPrice"></div>

      <div class="card">
        <div class="meta-row">
          <span class="k">发货方式</span>
          <span id="dDelivery">--</span>
        </div>
        <div class="meta-row">
          <span class="k">商品描述</span>
          <span class="detail-desc" id="dDesc"></span>
        </div>
      </div>

      <form class="card" id="buyForm">
        <div class="field">
          <label>购买数量</label>
          <div class="qty">
            <button type="button" id="qtyMinus" aria-label="减少数量">−</button>
            <div class="val" id="qtyVal">1</div>
            <button type="button" id="qtyPlus" aria-label="增加数量">＋</button>
          </div>
        </div>

        <div class="field">
          <label>支付方式</label>
          <div class="pay-methods">
            <label class="pay-opt">
              <input type="radio" name="payMethod" value="alipay" checked>
              <span class="pay-card">
                <span class="pay-name">💙 支付宝</span>
                <span class="pay-desc">扫码付款，店主确认后发货</span>
              </span>
            </label>
            <label class="pay-opt">
              <input type="radio" name="payMethod" value="usdt">
              <span class="pay-card">
                <span class="pay-name">💵 USDT（币安转账）</span>
                <span class="pay-desc">币安 UID 内部转账，免手续费</span>
              </span>
            </label>
          </div>
        </div>

        <div class="field" id="emailField" style="display:none">
          <label>收货邮箱 <span style="color:var(--err)">*</span></label>
          <input type="email" id="email" inputmode="email" autocomplete="email" placeholder="用于接收激活信息">
          <div class="hint">该商品需要邮箱激活，请填写常用邮箱</div>
          <div class="error-msg">请输入有效的邮箱地址</div>
        </div>

        <div class="field" style="margin-bottom:6px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:14px;color:var(--text-2)">应付金额</span>
            <span id="total" style="font-size:20px;font-weight:800;color:var(--brand-1)"></span>
          </div>
        </div>
      </form>

      <!-- 发货说明 -->
      <div class="card" style="margin-top:16px">
        <h3 style="margin:0 0 10px;font-size:15px">📦 发货说明</h3>
        <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--text-2);line-height:1.9">
          <li>店主手动发货，提交付款凭证后尽快确认（通常几小时内）</li>
          <li><strong style="color:var(--err,#c00)">必须上传付款截图，否则无法发货</strong></li>
          <li>发货后凭订单号在「查订单」页面查看卡密</li>
          <li>遇到问题点右下角「联系店主」，附上订单号更快解决</li>
        </ul>
      </div>
    </div>
  </main>

  <!-- 底部购买栏 -->
  <div class="buybar" id="buybar" style="display:none">
    <div class="buybar-inner">
      <button class="btn" id="buyBtn">立即购买</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var id = Jay.param('id');
    var loadingEl = document.getElementById('loading');
    var stateEl = document.getElementById('state');
    var detailEl = document.getElementById('detail');
    var buybarEl = document.getElementById('buybar');
    var product = null;
    var qty = 1;
    var maxQty = 99; // 购买上限：有库存数据时不超过剩余库存
    var submitting = false;

    var qtyVal = document.getElementById('qtyVal');
    var totalEl = document.getElementById('total');
    var emailField = document.getElementById('emailField');
    var emailInput = document.getElementById('email');

    function showState(html) {
      loadingEl.style.display = 'none';
      detailEl.style.display = 'none';
      buybarEl.style.display = 'none';
      stateEl.style.display = 'block';
      stateEl.innerHTML = html;
    }

    function updateTotal() {
      if (!product) return;
      qtyVal.textContent = qty;
      totalEl.textContent = Jay.fmtMoney(Number(product.price) * qty);
      document.getElementById('qtyMinus').disabled = qty <= 1;
      document.getElementById('qtyPlus').disabled = qty >= maxQty;
    }

    function validEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
    }

    async function submitOrder() {
      if (!product || submitting) return;

      // 邮箱必填校验（仅需要激活的商品）
      if (product.requiresEmailActivation) {
        var email = emailInput.value;
        if (!validEmail(email)) {
          emailField.classList.add('invalid');
          emailInput.focus();
          Jay.toast('请填写有效的邮箱地址', true);
          return;
        }
        emailField.classList.remove('invalid');
      }

      submitting = true;
      var btn = document.getElementById('buyBtn');
      btn.disabled = true;
      btn.textContent = '提交中…';

      var body = { productId: product.id, quantity: qty };
      if (product.requiresEmailActivation) {
        body.email = emailInput.value.trim();
      }
      var payMethod = 'alipay';
      var checked = document.querySelector('input[name="payMethod"]:checked');
      if (checked && checked.value === 'usdt') payMethod = 'usdt';
      body.payMethod = payMethod;

      var r = await Jay.api('/api/orders', { method: 'POST', body: body });

      if (r.ok && r.data && r.data.orderId) {
        var next = (r.data.payMethod === 'alipay' ? 'pay.html' : 'order.html') +
          '?id=' + encodeURIComponent(r.data.orderId);
        window.location.href = next;
        return;
      }

      submitting = false;
      btn.disabled = false;
      btn.textContent = '立即购买';

      if (r.networkError) {
        Jay.toast('网络连接失败，请检查网络后重试', true);
      } else if (r.status === 400) {
        var msg = (r.data && (r.data.error || r.data.message)) || '订单参数有误，请检查后重试';
        Jay.toast(msg, true);
      } else {
        Jay.toast('下单失败（' + r.status + '），请稍后重试', true);
      }
    }

    function render(p) {
      product = p;
      document.title = 'Jayshop · ' + (p.name || '商品详情');

      document.getElementById('dImg').innerHTML = Jay.thumbHTML(p);
      document.getElementById('dName').textContent = p.name || '未命名商品';

      var inStock = p.inStock !== false;
      var stockNum = (typeof p.stock === 'number' && isFinite(p.stock)) ? Math.floor(p.stock) : null;
      var stockHtml;
      if (!inStock) {
        stockHtml = '<span class="stock soldout"><span class="dot"></span>已售罄，暂时无法购买</span>';
      } else if (stockNum !== null && stockNum > 0) {
        stockHtml = stockNum < 10
          ? '<span class="stock ok"><span class="dot"></span>有货 · <strong style="color:var(--err,#c00)">仅剩 ' + stockNum + ' 件</strong></span>'
          : '<span class="stock ok"><span class="dot"></span>有货 · 库存 ' + stockNum + ' 件</span>';
      } else {
        stockHtml = '<span class="stock ok"><span class="dot"></span>有货，可立即购买</span>';
      }
      document.getElementById('dStock').innerHTML = stockHtml;
      // 购买数量上限：不超过剩余库存（无库存数据时保持 99）
      maxQty = stockNum !== null && stockNum > 0 ? Math.min(99, stockNum) : 99;
      if (qty > maxQty) qty = maxQty;

      document.getElementById('dPrice').textContent = Jay.fmtMoney(p.price);
      // 发货方式：兼容供应商返回对象形式 {type:'instant'}，避免显示 [object Object]
      document.getElementById('dDelivery').textContent = (function (d) {
        if (!d) return '下单后由店主发货';
        if (typeof d === 'string') return d;
        if (typeof d === 'object') {
          var map = { instant: '自动发货 · 卡密/账号直发', manual: '店主手动发货' };
          return d.label || map[d.type] || '下单后由店主发货';
        }
        return '下单后由店主发货';
      })(p.delivery);
      document.getElementById('dDesc').textContent = p.description || '暂无商品描述';

      if (p.requiresEmailActivation) {
        emailField.style.display = 'block';
      }

      if (!inStock) {
        var btn = document.getElementById('buyBtn');
        btn.disabled = true;
        btn.textContent = '已售罄';
      }

      updateTotal();
      loadingEl.style.display = 'none';
      detailEl.style.display = 'block';
      buybarEl.style.display = 'block';
    }

    async function load() {
      if (!id) {
        showState(Jay.notFoundHTML('缺少商品编号', '请从首页选择商品进入。', 'index.html'));
        return;
      }
      var r = await Jay.api('/api/products/' + encodeURIComponent(id));
      if (!r.ok) {
        if (r.status === 404) {
          showState(Jay.notFoundHTML('商品不存在', '该商品可能已下架或链接有误。', 'index.html'));
        } else {
          showState(Jay.errorStateHTML('商品加载失败',
            r.networkError ? '网络连接失败，请检查网络后重试。' : '服务器繁忙（' + r.status + '），请稍后重试。'));
        }
        return;
      }
      var p = r.data && (r.data.product || r.data);
      if (!p || !p.id) {
        showState(Jay.notFoundHTML('商品不存在', '该商品可能已下架或链接有误。', 'index.html'));
        return;
      }
      render(p);
    }

    document.getElementById('qtyMinus').addEventListener('click', function () {
      if (qty > 1) { qty--; updateTotal(); }
    });
    document.getElementById('qtyPlus').addEventListener('click', function () {
      if (qty < maxQty) { qty++; updateTotal(); }
    });
    emailInput.addEventListener('input', function () {
      emailField.classList.remove('invalid');
    });
    document.getElementById('buyForm').addEventListener('submit', function (e) { e.preventDefault(); });
    document.getElementById('buyBtn').addEventListener('click', submitOrder);

    load();
  })();
  </script>
</body>
</html>
